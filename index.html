<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap');

:root {
  --bg:rgb(48,46,43);
  --dark:rgb(118,149,86);
  --light:#eaedd1;
  --panel:#262421;
  --text:#eee;
  --muted:#aaa69f;
  --green:#81b64c;
  --red:#e05252;
}

* {box-sizing:border-box}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Google Sans',Arial,sans-serif;
  overflow:hidden;
}

button {font-family:inherit;cursor:pointer}

/* SCREEN TRANSITIONS */

.screen {
  position:fixed;
  inset:0;
  display:none;
  overflow-y:auto;
  overflow-x:hidden;
  background:var(--bg);
  z-index:1;
}

.screen.active {display:block}

#boot.active {
  display:flex;
  flex-direction:column;
}

.screen-content {
  min-height:100%;
  padding-top:65px;
}

header {
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:65px;
  display:none;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  background:#262421;
  border-bottom:1px solid #3b3935;
  z-index:20;
}

.header-left {
  display:flex;
  align-items:center;
  gap:18px;
}

.header-logo {
  width:115px;
  max-height:43px;
  object-fit:contain;
}

.header-back {
  background:none;
  border:none;
  color:#aaa;
  font-size:14px;
  font-weight:600;
}

.header-back:hover {color:white}

/* LANDING */

.landing-top {
  padding:24px 35px;
  height:90px;
  display:flex;
  align-items:center;
}

.landing-logo {
  width:145px;
  max-height:55px;
  object-fit:contain;
}

.landing-content {
  width:min(1120px,92%);
  margin:auto;
  flex:1;
  display:grid;
  grid-template-columns:1.05fr .95fr;
  align-items:center;
  gap:65px;
  padding-bottom:65px;
}

.hero-video {
  width:100%;
  aspect-ratio:1.12/1;
  object-fit:cover;
  border-radius:5px;
  background:#25231f;
}

.landing-text {
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}

.landing-text h1 {
  font-size:clamp(34px,4.3vw,53px);
  line-height:1.12;
  letter-spacing:-1.7px;
  margin:0 0 18px;
  font-weight:700;
}

.landing-text p {
  font-size:17px;
  line-height:1.6;
  color:#c3beb5;
  margin:0 0 30px;
  max-width:420px;
}

.get-started {
  width:100%;
  max-width:350px;
  height:58px;
  background:var(--green);
  color:white;
  border:none;
  border-radius:5px;
  font-size:18px;
  font-weight:700;
  transition:background .15s,transform .15s;
}

.get-started:hover {
  background:#91c75a;
  transform:translateY(-2px);
}

/* HOME */

.home-board .square {cursor:default}

.silhouette svg {
  width:100%;
  height:100%;
  display:block;
}

.silhouette.dark {background:#2b2927;color:#0d0c0b}
.silhouette.light {background:#b9b6b1;color:#f4f2ef}

.sidebar-heading.big {
  font-size:30px;
  letter-spacing:-.5px;
  padding:22px 16px;
}

.home-buttons {
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:22px 20px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.menu-button {
  width:100%;
  min-height:96px;
  flex:none;
  border:none;
  border-radius:8px;
  background:linear-gradient(#3d3a36,#312f2c);
  box-shadow:0 4px 0 #1e1c1a;
  color:white;
  display:flex;
  align-items:center;
  padding:0 22px;
  gap:22px;
  text-align:left;
  transition:transform .12s,background .15s,box-shadow .12s;
}

.menu-button:hover {
  background:linear-gradient(#47443f,#3a3733);
  transform:translateY(-2px);
}

.menu-button:active {
  transform:translateY(2px);
  box-shadow:0 2px 0 #1e1c1a;
}

.menu-icon {
  width:64px;
  height:64px;
  flex:none;
  display:grid;
  place-items:center;
  font-size:42px;
}

.menu-icon img {
  width:100%;
  height:100%;
  object-fit:contain;
}

.menu-label {
  font-size:24px;
  font-weight:700;
  letter-spacing:-.4px;
}

.menu-description {
  font-size:14px;
  color:#c3beb5;
  margin-top:4px;
}

/* GAME / PLAY BOTS LAYOUT */

.game-layout {
  display:flex;
  justify-content:center;
  align-items:stretch;
  gap:20px;
  margin:22px auto;
  padding:0 16px;
}

.board-area {
  flex:0 0 auto;
  width:max(300px,min(100vw - 450px,100vh - 215px,760px));
}

.player {
  height:49px;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:14px;
  font-weight:600;
}

.avatar {
  width:40px;
  height:40px;
  background:#44413b;
  border-radius:5px;
  display:grid;
  place-items:center;
  font-size:22px;
  overflow:hidden;
  flex:none;
}

.av {
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
}

.av img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.board {
  width:100%;
  aspect-ratio:1;
  display:grid;
  grid-template-columns:repeat(8,1fr);
  grid-template-rows:repeat(8,1fr);
  overflow:hidden;
  user-select:none;
}

.square {
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.square.light {background:var(--light)}
.square.dark {background:var(--dark)}

.square.selected {
  background-image:linear-gradient(rgba(255,220,0,.48),rgba(255,220,0,.48));
}

.square.last {
  background-image:linear-gradient(rgba(255,220,0,.23),rgba(255,220,0,.23));
}

.square img {
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  z-index:1;
}

.square .dot {
  position:absolute;
  width:25%;
  height:25%;
  border-radius:50%;
  background:rgba(30,40,20,.28);
}

.square .capture {
  position:absolute;
  inset:0;
  border:6px solid rgba(30,40,20,.25);
  border-radius:50%;
}

.coordinates {
  position:absolute;
  font-size:11px;
  font-weight:700;
  z-index:2;
  pointer-events:none;
}

.rank {top:3px;left:4px}
.file {bottom:3px;right:4px}

.light .coordinates {color:var(--dark)}
.dark .coordinates {color:var(--light)}

/* SIDEBAR */

.sidebar {
  flex:0 0 390px;
  position:relative;
  background:var(--panel);
  border-radius:6px;
  overflow:hidden;
}

.sidebar-inner {
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
}

.sidebar-heading {
  flex:none;
  padding:16px;
  background:#201f1c;
  border-bottom:1px solid #3b3935;
  font-weight:700;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.panel {
  flex:1;
  min-height:0;
  flex-direction:column;
}

.panel-scroll {
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:22px 16px 10px;
}

.panel-scroll::-webkit-scrollbar {width:7px}
.panel-scroll::-webkit-scrollbar-thumb {background:#4a4741;border-radius:4px}

.panel-bottom {
  flex:none;
  padding:14px 16px 16px;
  border-top:1px solid #3b3935;
  background:#262421;
}

.bot-intro {
  display:flex;
  align-items:center;
  gap:14px;
}

.big-avatar {
  width:92px;
  height:92px;
  flex:none;
  font-size:56px;
  display:grid;
  place-items:center;
}

.big-avatar img {object-fit:contain}

.speech {
  position:relative;
  flex:1;
  background:#fff;
  color:#262421;
  padding:15px 17px;
  border-radius:10px;
  font-size:15px;
  font-weight:600;
  line-height:1.4;
}

.speech::before {
  content:'';
  position:absolute;
  left:-9px;
  top:50%;
  margin-top:-9px;
  border:9px solid transparent;
  border-left:0;
  border-right-color:#fff;
}

.intro-name {
  margin:8px 0 18px;
  font-size:17px;
  font-weight:700;
}

.intro-name span {
  color:var(--muted);
  font-size:14px;
  font-weight:500;
  margin-left:8px;
}

.group {
  background:#2d2b28;
  border-radius:6px;
  padding:14px;
  margin-bottom:12px;
}

.group-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  font-weight:700;
  font-size:15px;
}

.group-head span {
  color:var(--muted);
  font-size:12px;
  font-weight:500;
}

.tile-grid {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.tile {
  aspect-ratio:1;
  padding:0;
  border:2px solid transparent;
  border-radius:5px;
  background:#3b3834;
  overflow:hidden;
  font-size:26px;
  color:white;
  transition:transform .12s,border-color .12s;
}

.tile:hover {
  transform:translateY(-2px);
  border-color:#777066;
}

.tile.selected {
  border-color:var(--green);
  background:#44503a;
}

.play-btn {
  width:100%;
  height:56px;
  background:var(--green);
  color:white;
  border:none;
  border-radius:6px;
  font-size:22px;
  font-weight:700;
  box-shadow:0 4px 0 #5d8a35;
  transition:background .15s;
}

.play-btn:hover {background:#91c75a}
.play-btn:active {transform:translateY(2px);box-shadow:0 2px 0 #5d8a35}

/* GAME PANEL */

#gamePanel {
  padding:16px;
  gap:12px;
}

.status {
  flex:none;
  font-size:15px;
  font-weight:700;
}

.moves {
  flex:1;
  min-height:80px;
  background:#201f1c;
  border-radius:4px;
  overflow-y:auto;
  padding:8px;
}

.move-row {
  display:grid;
  grid-template-columns:35px 1fr 1fr;
  padding:9px 6px;
  border-radius:3px;
  font-size:14px;
}

.move-row:nth-child(even) {background:#292722}
.move-number {color:#99948c}
.move {font-weight:500}

.controls {
  flex:none;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.controls button {
  height:42px;
  border:none;
  border-radius:4px;
  background:#45423c;
  color:white;
  font-size:13px;
  font-weight:600;
}

.controls button:hover {background:#57534b}
.controls button:disabled {opacity:.35;cursor:default}

.action-button {
  flex:none;
  width:100%;
  height:44px;
  background:#45423c;
  border:none;
  border-radius:4px;
  color:white;
  font-size:14px;
  font-weight:700;
}

.action-button:hover {background:#57534b}

/* PROMOTION */

.promotion {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:30;
}

.promotion-box {
  background:#292722;
  padding:20px;
  border-radius:6px;
  display:flex;
  gap:8px;
}

.promotion-box button {
  background:#44413b;
  border:0;
  border-radius:5px;
  width:65px;
  height:65px;
}

.promotion-box button:hover {background:#5b574e}
.promotion-box img {width:100%}

/* ONLINE ERROR */

.toast {
  position:fixed;
  top:85px;
  left:50%;
  transform:translate(-50%,-15px);
  opacity:0;
  pointer-events:none;
  background:#a93636;
  color:white;
  padding:14px 20px;
  border-radius:5px;
  font-size:14px;
  font-weight:600;
  z-index:40;
  transition:opacity .2s,transform .2s;
  text-align:center;
  width:max-content;
  max-width:90%;
}

.toast.show {
  opacity:1;
  transform:translate(-50%,0);
}

/* RESPONSIVE */

@media(max-width:900px) {
  .landing-content {
    grid-template-columns:1fr;
    max-width:550px;
    gap:30px;
    padding-bottom:35px;
  }

  .hero-video {
    aspect-ratio:16/9;
  }

  .landing-text h1 {font-size:38px}

  .game-layout {
    flex-direction:column;
    align-items:center;
    margin:12px auto;
    padding:0;
  }

  .board-area {
    width:min(100%,620px);
    padding:0 7px;
  }

  .player {padding:0 7px}

  .sidebar {
    flex:none;
    width:min(100%,620px);
    height:600px;
    border-radius:0;
  }
}

@media(max-width:650px) {
  header {padding:0 15px}
  .landing-top {padding:18px 20px;height:75px}
  .landing-logo {width:120px}
  .landing-content {width:90%;gap:25px}
  .landing-text h1 {font-size:34px}
  .landing-text p {font-size:15px}
}
</style>
</head>

            </button>

            <button class="menu-button" onclick="startPractice()">

              <span>

              </span>

          </div>

        </div>
      </aside>

    </div>
  </div>
</section>

<!-- GAME / PLAY BOTS SCREEN -->

<section id="game" class="screen">
  <div class="screen-content">

    <div class="game-layout">

      <div class="board-area">

        <div class="player">
          <div class="avatar" id="blackAvatar">♟</div>
          <span id="blackName">Black</span>

        </div>

        <div class="board" id="board"></div>

          <span>You</span>
        </div>

      </div>

      <aside class="sidebar">
        <div class="sidebar-inner">

          <div class="sidebar-heading">
            <span id="headingIcon">🤖</span>

          </div>

          <div class="panel" id="selectPanel" style="display:flex">

            <div class="panel-scroll">
              <div class="bot-intro">
                <div class="big-avatar" id="introAvatar"></div>
                <div class="speech" id="introSpeech"></div>
              </div>

              <div class="intro-name">
                <b id="introName"></b><span id="introElo"></span>
              </div>

              <div id="botGroups"></div>
            </div>

            <div class="panel-bottom">
              <button class="play-btn" onclick="startBotGame()">Play</button>
            </div>

          </div>

          <!-- IN-GAME PANEL -->
          <div class="panel" id="gamePanel" style="display:none">

            <div class="bot-intro" id="gameBotHead">
              <div class="big-avatar" id="gameBotAvatar"></div>
              <div class="speech" id="botMessage">Let's play some chess!</div>
            </div>

            <div class="status" id="status">White to move</div>

            <div class="moves" id="moves"></div>

            <div class="controls">
              <button id="undo">↶ Undo</button>
              <button id="flip">⇅ Flip</button>
              <button id="restart">↻ Restart</button>
            </div>

            <button class="action-button" onclick="leaveGame()">Leave game</button>

          </div>

        </div>
      </aside>

    </div>
  </div>
</section>

<div class="promotion" id="promotion">
  <div class="promotion-box" id="promotionChoices"></div>
</div>

<div class="toast" id="toast"></div>

/* =====================================
   SCREEN NAVIGATION
===================================== */

function showScreen(id) {
  const current=screenHistory[screenHistory.length-1];

  if(current===id)return;

  screenHistory.push(id);
  renderScreen();
}

function renderScreen() {
  const id=screenHistory[screenHistory.length-1];

  document.querySelectorAll('.screen').forEach(s=>{
    s.classList.remove('active');
  });

  document.getElementById(id).classList.add('active');

  document.getElementById('header').style.display=
    id==='boot'?'none':'flex';

  if(id==='home')renderHomeBoard();

  if(id==='boot') {
    const video=document.querySelector('.hero-video');
    if(video)video.play().catch(()=>{});
  }
}

function stopBot() {
  clearTimeout(botTimer);
  botThinking=false;
  pendingPromotion=null;
  document.getElementById('promotion').style.display='none';
}

function goBack() {
  if(screenHistory.length<=1)return;

  const current=screenHistory.pop();

  if(current==='game')stopBot();

  renderScreen();
}

  img.onerror=()=>{

    fallback.style.display='grid';
  };

function createPreviewBoard(container) {
  container.innerHTML='';

  const backrank=['r','n','b','q','k','b','n','r'];

  for(let i=0;i<64;i++) {
    const row=Math.floor(i/8);
    const col=i%8;

    const square=document.createElement('div');
    square.className='square '+((row+col)%2===0?'light':'dark');

    let piece=null;
    let side=null;

    if(row===0){piece=backrank[col];side='b'}
    if(row===1){piece='p';side='b'}
    if(row===6){piece='p';side='w'}
    if(row===7){piece=backrank[col];side='w'}

    if(piece) {
      const img=document.createElement('img');
      img.src=piecePaths[side]+side+piece+'.png';
      img.draggable=false;
      square.appendChild(img);
    }

    if(col===0) {
      const rank=document.createElement('span');
      rank.className='coordinates rank';
      rank.textContent=8-row;
      square.appendChild(rank);
    }

    if(row===7) {
      const file=document.createElement('span');
      file.className='coordinates file';
      file.textContent='abcdefgh'[col];
      square.appendChild(file);
    }

    container.appendChild(square);
  }
}

// Menu icons: try each listed path, fall back to an emoji if none load.
function initIcons() {
  document.querySelectorAll('img[data-srcs]').forEach(img=>{
    const sources=img.dataset.srcs.split('|');
    let index=0;

    img.onerror=()=>{
      index++;

      if(index<sources.length) {
        img.src=sources[index];
      } else {
        img.replaceWith(document.createTextNode(img.dataset.fallback||''));
      }
    };

    img.src=sources[0];
  });
}

function squareName(row,col) {
  return 'abcdefgh'[col]+(8-row);
}

function renderGame() {
  const element=document.getElementById('board');
  element.innerHTML='';

  const board=game.board();
  const legal=selectedSquare?
    game.moves({square:selectedSquare,verbose:true}):[];

  const destinations=legal.map(m=>m.to);
  const history=game.history({verbose:true});
  const lastMove=history.length?history[history.length-1]:null;

  for(let display=0;display<64;display++) {
    const i=flipped?63-display:display;
    const row=Math.floor(i/8);
    const col=i%8;
    const name=squareName(row,col);

    const square=document.createElement('div');
    square.className='square '+((row+col)%2===0?'light':'dark');

    const piece=board[row][col];

    if(selectedSquare===name)square.classList.add('selected');

    if(lastMove&&(lastMove.from===name||lastMove.to===name)) {
      square.classList.add('last');
    }

    if(piece) {
      const img=document.createElement('img');
      img.src=piecePaths[piece.color]+
        piece.color+pieceLetters[piece.type]+'.png';
      img.alt=piece.color+piece.type;
      img.draggable=false;
      square.appendChild(img);
    }

    if(destinations.includes(name)) {
      const marker=document.createElement('div');
      marker.className=piece?'capture':'dot';
      square.appendChild(marker);
    }

    if(col===0) {
      const rank=document.createElement('span');
      rank.className='coordinates rank';
      rank.textContent=8-row;
      square.appendChild(rank);
    }

    if(row===7) {
      const file=document.createElement('span');
      file.className='coordinates file';
      file.textContent='abcdefgh'[col];
      square.appendChild(file);
    }

    square.addEventListener('click',()=>clickSquare(name));
    element.appendChild(square);
  }

  renderMoves();
  updateStatus();

  document.getElementById('undo').disabled=
    game.history().length===0;
}

function renderMoves() {
  const element=document.getElementById('moves');
  const history=game.history();

  element.innerHTML='';

  for(let i=0;i<history.length;i+=2) {
    const row=document.createElement('div');
    row.className='move-row';

    const number=document.createElement('span');
    number.className='move-number';
    number.textContent=(Math.floor(i/2)+1)+'.';

    const white=document.createElement('span');
    white.className='move';
    white.textContent=history[i]||'';

    const black=document.createElement('span');
    black.className='move';
    black.textContent=history[i+1]||'';

    row.append(number,white,black);
    element.appendChild(row);
  }

  element.scrollTop=element.scrollHeight;
}

function updateStatus() {
  const status=document.getElementById('status');

  if(game.in_checkmate()) {
    status.textContent='Checkmate! '+
      (game.turn()==='w'?'Black':'White')+' wins.';
  } else if(game.in_stalemate()) {
    status.textContent='Draw by stalemate.';
  } else if(game.in_draw()) {
    status.textContent='Game drawn.';
  } else if(game.in_check()) {
    status.textContent=
      (game.turn()==='w'?'White':'Black')+' to move · Check';
  } else {
    status.textContent=
      (game.turn()==='w'?'White':'Black')+' to move';
  }
}

/* =====================================
   PLAYER MOVES
===================================== */

function clickSquare(square) {
  if(phase!=='playing')return;
  if(game.game_over()||botThinking||pendingPromotion)return;

  if(mode==='bot'&&game.turn()==='b')return;

  const piece=game.get(square);

  if(!selectedSquare) {
    if(piece&&piece.color===game.turn()) {
      selectedSquare=square;
      renderGame();
    }
    return;
  }

  if(piece&&piece.color===game.turn()) {
    selectedSquare=square;
    renderGame();
    return;
  }

  const possible=game.moves({
    square:selectedSquare,
    verbose:true
  }).filter(m=>m.to===square);

  if(!possible.length) {
    selectedSquare=null;
    renderGame();
    return;
  }

  const move=possible[0];

  if(move.flags.includes('p')) {
    pendingPromotion={
      from:selectedSquare,
      to:square
    };

    selectedSquare=null;
    showPromotion();
    return;
  }

  makePlayerMove({
    from:selectedSquare,
    to:square
  });
}

function makePlayerMove(move) {
  try {
    game.move({promotion:'q',...move});
  } catch(e) {
    return;
  }

  selectedSquare=null;
  renderGame();

  if(game.game_over()) {
    finishGame();
    return;
  }

  if(mode==='bot') {
    randomLine('thinking');
    scheduleBot();
  }
}

}

/* =====================================
   BOT BRAIN
   A real alpha-beta search. Elo controls how deep it looks,
   how long it thinks, and how often it plays a weaker move.
===================================== */

const pieceValues={p:100,n:320,b:330,r:500,q:900,k:0};
const MATE=100000;
const TIMEOUT={timeout:true};

let searchNodes=0;
let searchDeadline=0;

// Piece-square tables, written from White's side (rank 8 first).
const PST={
  p:[0,0,0,0,0,0,0,0,
     50,50,50,50,50,50,50,50,
     10,10,20,30,30,20,10,10,
     5,5,10,25,25,10,5,5,
     0,0,0,20,20,0,0,0,
     5,-5,-10,0,0,-10,-5,5,
     5,10,10,-20,-20,10,10,5,
     0,0,0,0,0,0,0,0],
  n:[-50,-40,-30,-30,-30,-30,-40,-50,
     -40,-20,0,0,0,0,-20,-40,
     -30,0,10,15,15,10,0,-30,
     -30,5,15,20,20,15,5,-30,
     -30,0,15,20,20,15,0,-30,
     -30,5,10,15,15,10,5,-30,
     -40,-20,0,5,5,0,-20,-40,
     -50,-40,-30,-30,-30,-30,-40,-50],
  b:[-20,-10,-10,-10,-10,-10,-10,-20,
     -10,0,0,0,0,0,0,-10,
     -10,0,5,10,10,5,0,-10,
     -10,5,5,10,10,5,5,-10,
     -10,0,10,10,10,10,0,-10,
     -10,10,10,10,10,10,10,-10,
     -10,5,0,0,0,0,5,-10,
     -20,-10,-10,-10,-10,-10,-10,-20],
  r:[0,0,0,0,0,0,0,0,
     5,10,10,10,10,10,10,5,
     -5,0,0,0,0,0,0,-5,
     -5,0,0,0,0,0,0,-5,
     -5,0,0,0,0,0,0,-5,
     -5,0,0,0,0,0,0,-5,
     -5,0,0,0,0,0,0,-5,
     0,0,0,5,5,0,0,0],
  q:[-20,-10,-10,-5,-5,-10,-10,-20,
     -10,0,0,0,0,0,0,-10,
     -10,0,5,5,5,5,0,-10,
     -5,0,5,5,5,5,0,-5,
     0,0,5,5,5,5,0,-5,
     -10,5,5,5,5,5,0,-10,
     -10,0,5,0,0,0,0,-10,
     -20,-10,-10,-5,-5,-10,-10,-20],
  k:[-30,-40,-40,-50,-50,-40,-40,-30,
     -30,-40,-40,-50,-50,-40,-40,-30,
     -30,-40,-40,-50,-50,-40,-40,-30,
     -30,-40,-40,-50,-50,-40,-40,-30,
     -20,-30,-30,-40,-40,-30,-30,-20,
     -10,-20,-20,-20,-20,-20,-20,-10,
     20,20,0,0,0,0,20,20,
     20,30,10,0,0,10,30,20]
};

// Score of the current position for the side to move (centipawns).
function staticEval() {
  const board=game.board();
  let score=0;

  for(let r=0;r<8;r++) {
    for(let c=0;c<8;c++) {
      const p=board[r][c];
      if(!p)continue;

      const index=p.color==='w'?r*8+c:(7-r)*8+c;
      const value=pieceValues[p.type]+PST[p.type][index];

      score+=p.color==='w'?value:-value;
    }
  }

  return game.turn()==='w'?score:-score;
}

function orderMoves(moves) {
  for(const m of moves) {
    let s=0;

    if(m.captured)s+=10*pieceValues[m.captured]-pieceValues[m.piece]/10;
    if(m.promotion)s+=pieceValues[m.promotion];
    if(m.san.indexOf('+')>-1)s+=30;

    m.order=s;
  }

  moves.sort((a,b)=>b.order-a.order);
}

function checkTime() {
  if((++searchNodes&255)===0&&Date.now()>searchDeadline)throw TIMEOUT;
}

// Only look at captures/promotions so the search doesn't stop mid-trade.
function quiesce(alpha,beta,qdepth) {
  checkTime();

  const stand=staticEval();

  if(qdepth>=6)return stand;
  if(stand>=beta)return stand;
  if(stand>alpha)alpha=stand;

  const moves=game.moves({verbose:true})
    .filter(m=>m.captured||m.promotion);

  orderMoves(moves);

  for(const m of moves) {
    game.move({from:m.from,to:m.to,promotion:m.promotion});

    let score;
    try {
      score=-quiesce(-beta,-alpha,qdepth+1);
    } finally {
      game.undo();
    }

    if(score>=beta)return score;
    if(score>alpha)alpha=score;
  }

  return alpha;
}

function negamax(depth,alpha,beta,ply,useQuiesce) {
  checkTime();

  if(depth<=0) {
    return useQuiesce?quiesce(alpha,beta,0):staticEval();
  }

  const moves=game.moves({verbose:true});

  if(!moves.length) {
    return game.in_check()?-(MATE-ply):0;
  }

  orderMoves(moves);

  let best=-Infinity;

  for(const m of moves) {
    game.move({from:m.from,to:m.to,promotion:m.promotion});

    let score;
    try {
      score=-negamax(depth-1,-beta,-alpha,ply+1,useQuiesce);
    } finally {
      game.undo();
    }

    if(score>best)best=score;
    if(best>alpha)alpha=best;
    if(alpha>=beta)break;
  }

  return best;
}

// How strong each bot plays:
//   depth    - how many moves ahead it looks
//   quiesce  - whether it sees trades through to the end
//   noise    - random error added to each move's score (centipawns)
//   random   - chance it just plays a random legal move
//   time     - thinking time limit in ms
function botParams(elo) {
  if(elo<=150)  return {depth:1,quiesce:false,noise:180,random:.35,time:300};
  if(elo<=250)  return {depth:1,quiesce:false,noise:120,random:.20,time:300};
  if(elo<=400)  return {depth:1,quiesce:false,noise:70, random:.10,time:400};
  if(elo<=700)  return {depth:2,quiesce:false,noise:50, random:.05,time:800};
  if(elo<=1000) return {depth:2,quiesce:true, noise:30, random:.02,time:1000};
  if(elo<=1300) return {depth:3,quiesce:true, noise:18, random:.01,time:1500};
  if(elo<=1500) return {depth:3,quiesce:true, noise:8,  random:0,  time:2000};
  if(elo<=2000) return {depth:4,quiesce:true, noise:0,  random:0,  time:2500};
  return            {depth:6,quiesce:true, noise:0,  random:0,  time:2500};
}

function chooseBotMove() {
  let moves=game.moves({verbose:true});

  if(!moves.length)return null;

  const bot=bots[selectedBot];
  const p=botParams(bot.elo);

  if(Math.random()<p.random) {
    return moves[Math.floor(Math.random()*moves.length)];
  }

  orderMoves(moves);

  searchNodes=0;
  searchDeadline=Date.now()+p.time;

  let completed=null;

  // Iterative deepening: keep the last depth that finished in time.
  for(let depth=1;depth<=p.depth;depth++) {
    const scored=[];
    let bestScore=-Infinity;

    try {
      for(const m of moves) {
        game.move({from:m.from,to:m.to,promotion:m.promotion});

        let score;
        try {
          score=p.noise>0
            ?-negamax(depth-1,-Infinity,Infinity,1,p.quiesce)
            :-negamax(depth-1,-Infinity,-bestScore,1,p.quiesce);
        } finally {
          game.undo();
        }

        scored.push({move:m,score});
        if(score>bestScore)bestScore=score;
      }
    } catch(e) {
      if(e!==TIMEOUT)throw e;
      break;
    }

    scored.sort((a,b)=>b.score-a.score);
    completed=scored;
    moves=scored.map(x=>x.move);

    if(bestScore>MATE-100)break;   // found a forced mate
  }

  if(!completed)return moves[0];

  let best=null;
  let bestValue=-Infinity;

  for(const s of completed) {
    const jitter=p.noise?(Math.random()*2-1)*p.noise:0;
    const value=s.score+jitter;

    if(value>bestValue) {
      bestValue=value;
      best=s.move;
    }
  }

  return best;
}

function scheduleBot() {
  if(game.game_over())return;

  botThinking=true;

  botTimer=setTimeout(()=>{
    if(game.game_over()) {
      botThinking=false;
      return;
    }

    const move=chooseBotMove();

    if(!move) {
      botThinking=false;
      return;
    }

    try {
      game.move({
        from:move.from,
        to:move.to,
        promotion:'q'
      });
    } catch(e) {
      botThinking=false;
      return;
    }

    botThinking=false;
    selectedSquare=null;
    renderGame();

    if(game.game_over()) {
      finishGame();
      return;
    }

    if(game.in_check()) {
      randomLine('check');
    } else if(Math.random()<.3) {
      randomLine(move.captured?'capture':'thinking');
    }

  },350+Math.random()*500);
}

/* =====================================
   END GAME
===================================== */

function finishGame() {
  botThinking=false;
  clearTimeout(botTimer);
  renderGame();

  if(mode!=='bot')return;

  if(game.in_checkmate()) {
    if(game.turn()==='w') {
      randomLine('win');
    } else {
      randomLine('lose');
    }
  } else {
    setMessage('Draw! Good game.');
  }
}

/* =====================================
   GAME CONTROLS
===================================== */

document.getElementById('undo').onclick=()=>{
  if(!game||!game.history().length)return;

  game.undo();

  if(mode==='bot'&&game.turn()==='b'&&game.history().length) {
    game.undo();
  }

  selectedSquare=null;
  botThinking=false;
  clearTimeout(botTimer);
  renderGame();
};

document.getElementById('flip').onclick=()=>{
  flipped=!flipped;
  renderGame();
};

document.getElementById('restart').onclick=()=>{
  if(game&&phase==='playing')startGame();
};

/* =====================================
   ONLINE PLACEHOLDER
===================================== */

function onlineUnavailable() {
  const toast=document.getElementById('toast');

  toast.textContent=
    'Online is currently unavailable! Come back soon...';

  toast.classList.add('show');

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    toast.classList.remove('show');
  },3500);
}

/* =====================================
   INITIALIZE
===================================== */

renderHomeBoard();
initIcons();

</script>
</body>
</html>
