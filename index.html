
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap');

:root {
  --bg:rgb(48,46,43);
  --dark:rgb(118,149,86);
  --light:#eaedd1;
  --panel:#262421;
  --text:#eee;
  --muted:#aaa69f;
  --green:#81b64c;
  --red:#e05252;
}

* {box-sizing:border-box}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Google Sans',Arial,sans-serif;
  overflow:hidden;
}

button {font-family:inherit;cursor:pointer}

/* SCREEN TRANSITIONS */

.screen {
  position:fixed;
  inset:0;
  display:none;
  overflow-y:auto;
  overflow-x:hidden;
  background:var(--bg);
  z-index:1;
}

.screen.active {display:block}

#boot.active {
  display:flex;
  flex-direction:column;
}

.screen-content {
  min-height:100%;
  padding-top:65px;
}

header {
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:65px;
  display:none;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  background:#262421;
  border-bottom:1px solid #3b3935;
  z-index:20;
}

.header-left {
  display:flex;
  align-items:center;
  gap:18px;
}

.header-logo {
  width:115px;
  max-height:43px;
  object-fit:contain;
}

.header-back {
  background:none;
  border:none;
  color:#aaa;
  font-size:14px;
  font-weight:600;
}

.header-back:hover {color:white}

/* LANDING */

.landing-top {
  padding:24px 35px;
  height:90px;
  display:flex;
  align-items:center;
}

.landing-logo {
  width:145px;
  max-height:55px;
  object-fit:contain;
}

.landing-content {
  width:min(1120px,92%);
  margin:auto;
  flex:1;
  display:grid;
  grid-template-columns:1.05fr .95fr;
  align-items:center;
  gap:65px;
  padding-bottom:65px;
}

.hero-video {
  width:100%;
  aspect-ratio:1.12/1;
  object-fit:cover;
  border-radius:5px;
  background:#25231f;
}

.landing-text {
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}

.landing-text h1 {
  font-size:clamp(34px,4.3vw,53px);
  line-height:1.12;
  letter-spacing:-1.7px;
  margin:0 0 18px;
  font-weight:700;
}

.landing-text p {
  font-size:17px;
  line-height:1.6;
  color:#c3beb5;
  margin:0 0 30px;
  max-width:420px;
}

.get-started {
  width:100%;
  max-width:350px;
  height:58px;
  background:var(--green);
  color:white;
  border:none;
  border-radius:5px;
  font-size:18px;
  font-weight:700;
  transition:background .15s,transform .15s;
}

.get-started:hover {
  background:#91c75a;
  transform:translateY(-2px);
}

/* HOME */

.home-layout {
  max-width:1100px;
  width:94%;
  margin:45px auto;
  display:grid;
  grid-template-columns:minmax(0,600px) minmax(250px,350px);
  align-items:center;
  gap:55px;
}

.home-board {
  width:100%;
  aspect-ratio:1;
  display:grid;
  grid-template-columns:repeat(8,1fr);
  overflow:hidden;
}

.home-square {
  display:flex;
  align-items:center;
  justify-content:center;
}

.home-square.light {background:var(--light)}
.home-square.dark {background:var(--dark)}

.home-square img {
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}

.home-menu {
  display:flex;
  flex-direction:column;
  gap:13px;
}

.home-title {
  font-size:34px;
  font-weight:700;
  letter-spacing:-1px;
  margin:0 0 5px;
}

.home-subtitle {
  color:var(--muted);
  margin:0 0 20px;
  font-size:14px;
}

.menu-button {
  width:100%;
  height:65px;
  border:1px solid #45413b;
  border-radius:5px;
  background:#262421;
  color:white;
  display:flex;
  align-items:center;
  padding:0 17px;
  gap:15px;
  text-align:left;
  transition:background .15s,border .15s;
}

.menu-button:hover {
  background:#37342f;
  border-color:#69645b;
}

.menu-icon {
  font-size:25px;
  width:32px;
  text-align:center;
}

.menu-label {
  font-size:16px;
  font-weight:700;
}

.menu-description {
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

/* BOTS */

.page-container {
  max-width:1100px;
  width:94%;
  margin:40px auto;
}

.page-title {
  font-size:30px;
  margin:0;
  letter-spacing:-.8px;
}

.page-subtitle {
  color:var(--muted);
  margin:9px 0 28px;
  font-size:14px;
}

.bot-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:13px;
}

.bot-card {
  background:#262421;
  border:1px solid #3d3933;
  border-radius:6px;
  overflow:hidden;
  cursor:pointer;
  transition:background .15s,border .15s;
}

.bot-card:hover {
  background:#35322d;
  border-color:#777066;
}

.bot-card.selected {
  border:2px solid var(--green);
  background:#34392c;
}

.bot-cover {
  width:100%;
  aspect-ratio:2.1/1;
  background:#39362f;
  position:relative;
  overflow:hidden;
}

.bot-cover img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.bot-cover-fallback {
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  font-size:45px;
  background:#37342e;
}

.bot-details {
  padding:14px;
}

.bot-name {
  font-weight:700;
  font-size:16px;
}

.bot-elo {
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}

.bot-description {
  font-size:12px;
  color:#b9b4aa;
  margin-top:12px;
  line-height:1.5;
}

.bot-quote {
  color:#a8c982;
  font-size:12px;
  margin-top:9px;
}

.bot-bottom {
  margin-top:25px;
  display:flex;
  align-items:center;
  gap:12px;
}

.start-bot {
  height:48px;
  background:var(--green);
  color:white;
  border:none;
  border-radius:5px;
  font-size:15px;
  font-weight:700;
  padding:0 28px;
}

.start-bot:disabled {
  opacity:.4;
  cursor:default;
}

.start-bot:not(:disabled):hover {
  background:#91c75a;
}

/* GAME */

.game-layout {
  width:min(1100px,95%);
  margin:30px auto;
  display:grid;
  grid-template-columns:minmax(0,650px) minmax(250px,330px);
  gap:25px;
  align-items:start;
}

.board-area {width:100%}

.player {
  height:49px;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:14px;
  font-weight:600;
}

.avatar {
  width:31px;
  height:31px;
  background:#44413b;
  border-radius:5px;
  display:grid;
  place-items:center;
  font-size:19px;
  overflow:hidden;
}

.avatar img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.board {
  width:100%;
  aspect-ratio:1;
  display:grid;
  grid-template-columns:repeat(8,1fr);
  grid-template-rows:repeat(8,1fr);
  overflow:hidden;
  user-select:none;
}

.square {
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.square.light {background:var(--light)}
.square.dark {background:var(--dark)}

.square.selected {
  background-image:linear-gradient(rgba(255,220,0,.48),rgba(255,220,0,.48));
}

.square.last {
  background-image:linear-gradient(rgba(255,220,0,.23),rgba(255,220,0,.23));
}

.square img {
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  z-index:1;
}

.square .dot {
  position:absolute;
  width:25%;
  height:25%;
  border-radius:50%;
  background:rgba(30,40,20,.28);
}

.square .capture {
  position:absolute;
  inset:0;
  border:6px solid rgba(30,40,20,.25);
  border-radius:50%;
}

.coordinates {
  position:absolute;
  font-size:11px;
  font-weight:700;
  z-index:2;
  pointer-events:none;
}

.rank {top:3px;left:4px}
.file {bottom:3px;right:4px}

.light .coordinates {color:var(--dark)}
.dark .coordinates {color:var(--light)}

.sidebar {
  background:var(--panel);
  border-radius:5px;
  overflow:hidden;
}

.sidebar-heading {
  padding:17px;
  border-bottom:1px solid #3b3935;
  font-weight:700;
  font-size:15px;
}

.game-info {padding:17px}

.status {
  font-size:15px;
  font-weight:700;
  margin-bottom:14px;
}

.bot-message {
  padding:12px;
  background:#34312c;
  border-radius:5px;
  margin-bottom:15px;
  font-size:13px;
  line-height:1.5;
  color:#ddd8cf;
  min-height:52px;
}

.moves {
  background:#201f1c;
  border-radius:4px;
  min-height:150px;
  max-height:270px;
  overflow-y:auto;
  padding:8px;
}

.move-row {
  display:grid;
  grid-template-columns:35px 1fr 1fr;
  padding:9px 6px;
  border-radius:3px;
  font-size:14px;
}

.move-row:nth-child(even) {background:#292722}
.move-number {color:#99948c}
.move {font-weight:500}

.controls {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:14px;
}

.controls button {
  height:42px;
  border:none;
  border-radius:4px;
  background:#45423c;
  color:white;
  font-size:13px;
  font-weight:600;
}

.controls button:hover {background:#57534b}
.controls button:disabled {opacity:.35;cursor:default}

.action-button {
  width:100%;
  height:44px;
  margin-top:10px;
  background:var(--green);
  border:none;
  border-radius:4px;
  color:white;
  font-size:14px;
  font-weight:700;
}

.action-button:hover {background:#91c75a}

/* PROMOTION */

.promotion {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:30;
}

.promotion-box {
  background:#292722;
  padding:20px;
  border-radius:6px;
  display:flex;
  gap:8px;
}

.promotion-box button {
  background:#44413b;
  border:0;
  border-radius:5px;
  width:65px;
  height:65px;
}

.promotion-box button:hover {background:#5b574e}
.promotion-box img {width:100%}

/* ONLINE ERROR */

.toast {
  position:fixed;
  top:85px;
  left:50%;
  transform:translate(-50%,-15px);
  opacity:0;
  pointer-events:none;
  background:#a93636;
  color:white;
  padding:14px 20px;
  border-radius:5px;
  font-size:14px;
  font-weight:600;
  z-index:40;
  transition:opacity .2s,transform .2s;
  text-align:center;
  width:max-content;
  max-width:90%;
}

.toast.show {
  opacity:1;
  transform:translate(-50%,0);
}

/* RESPONSIVE */

@media(max-width:850px) {
  .landing-content {
    grid-template-columns:1fr;
    max-width:550px;
    gap:30px;
    padding-bottom:35px;
  }

  .hero-video {
    aspect-ratio:16/9;
  }

  .landing-text h1 {font-size:38px}

  .home-layout {
    grid-template-columns:minmax(0,1fr);
    max-width:550px;
    margin:25px auto;
    gap:25px;
  }

  .game-layout {
    display:flex;
    flex-direction:column;
    max-width:620px;
    margin:15px auto;
  }

  .sidebar {width:100%}
}

@media(max-width:650px) {
  header {padding:0 15px}
  .landing-top {padding:18px 20px;height:75px}
  .landing-logo {width:120px}
  .landing-content {width:90%;gap:25px}
  .landing-text h1 {font-size:34px}
  .landing-text p {font-size:15px}
  .page-container {margin:25px auto}
  .bot-grid {grid-template-columns:repeat(2,minmax(0,1fr))}
  .page-title {font-size:26px}
  .game-layout {width:100%}
  .board-area {padding:0 7px}
  .player {padding:0 7px}
  .sidebar {border-radius:0}
}

@media(max-width:390px) {
  .bot-grid {grid-template-columns:1fr}
}
</style>
</head>

<body>

<header id="header">
  <div class="header-left">
    <button class="header-back" onclick="goBack()">← Back</button>
    <img src="Resources/logo.svg" class="header-logo" alt="Chess">
  </div>
</header>

<!-- LANDING SCREEN -->

<section id="boot" class="screen active">

  <div class="landing-top">
    <img src="Resources/logo.svg" class="landing-logo" alt="Chess">
  </div>

  <div class="landing-content">

    <video class="hero-video"
      src="https://assets-configurator.chess.com/video/configurator/hero_1780586045036.webm"
      autoplay muted loop playsinline preload="auto">
    </video>

    <div class="landing-text">
      <h1>Play Chess Online on the #1 Site!</h1>

      <p><strong>Join 250+ million players in the world's largest chess community</strong></p>

      <button class="get-started" onclick="showScreen('home')">
        Get Started
      </button>
    </div>

  </div>
</section>

<!-- HOME SCREEN -->

<section id="home" class="screen">
  <div class="screen-content">

    <div class="home-layout">

      <div class="home-board" id="homeBoard"></div>

      <div class="home-menu">
        <h1 class="home-title">Play Chess</h1>
        <p class="home-subtitle">Choose how you want to play.</p>

        <button class="menu-button" onclick="showScreen('bots')">
          <span class="menu-icon">♟</span>
          <span>
            <div class="menu-label">Play Bots</div>
            <div class="menu-description">Play against computer opponents</div>
          </span>
        </button>

        <button class="menu-button" onclick="onlineUnavailable()">
          <span class="menu-icon">♟</span>
          <span>
            <div class="menu-label">Play Online</div>
            <div class="menu-description">Challenge other players</div>
          </span>
        </button>

        <button class="menu-button" onclick="startPractice()">
          <span class="menu-icon">♜</span>
          <span>
            <div class="menu-label">Practice</div>
            <div class="menu-description">Play both sides and practice</div>
          </span>
        </button>
      </div>

    </div>
  </div>
</section>

<!-- BOT SELECTION -->

<section id="bots" class="screen">
  <div class="screen-content">
    <div class="page-container">

      <h1 class="page-title">Choose your opponent</h1>
      <p class="page-subtitle">Every opponent has their own personality and playing strength.</p>

      <div class="bot-grid" id="botGrid"></div>

      <div class="bot-bottom">
        <button class="start-bot" onclick="startBotGame()" id="startBot" disabled>
          Choose an opponent
        </button>
      </div>

    </div>
  </div>
</section>

<!-- GAME SCREEN -->

<section id="game" class="screen">
  <div class="screen-content">

    <div class="game-layout">

      <div class="board-area">

        <div class="player">
          <div class="avatar" id="blackAvatar">♟</div>
          <span id="blackName">Black</span>
          <span id="blackElo" style="color:var(--muted);font-size:12px"></span>
        </div>

        <div class="board" id="board"></div>

        <div class="player">
          <div class="avatar">♙</div>
          <span>You</span>
        </div>

      </div>

      <aside class="sidebar">

        <div class="sidebar-heading">Game</div>

        <div class="game-info">

          <div class="status" id="status">White to move</div>

          <div class="bot-message" id="botMessage">
            Let's play some chess!
          </div>

          <div class="moves" id="moves"></div>

          <div class="controls">
            <button id="undo">↶ Undo</button>
            <button id="flip">⇅ Flip</button>
            <button id="restart">↻ Restart</button>
          </div>

          <button class="action-button" onclick="goBack()">Leave game</button>

        </div>
      </aside>

    </div>
  </div>
</section>

<div class="promotion" id="promotion">
  <div class="promotion-box" id="promotionChoices"></div>
</div>

<div class="toast" id="toast"></div>

<script>

/* =====================================
   STATE
===================================== */

let screenHistory = ['boot'];

let selectedBot = null;
let game = null;
let mode = 'bot';
let flipped = false;
let selectedSquare = null;
let pendingPromotion = null;
let botThinking = false;
let botTimer = null;
let toastTimer = null;
let messageLast = '';

/* =====================================
   SCREEN NAVIGATION
===================================== */

function showScreen(id) {
  const current=screenHistory[screenHistory.length-1];

  if(current===id)return;

  screenHistory.push(id);
  renderScreen();
}

function renderScreen() {
  const id=screenHistory[screenHistory.length-1];

  document.querySelectorAll('.screen').forEach(s=>{
    s.classList.remove('active');
  });

  document.getElementById(id).classList.add('active');

  document.getElementById('header').style.display=
    id==='boot'?'none':'flex';

  if(id==='home')renderHomeBoard();

  if(id==='boot') {
    const video=document.querySelector('.hero-video');
    if(video)video.play().catch(()=>{});
  }
}

function goBack() {
  if(screenHistory.length<=1)return;

  const current=screenHistory.pop();

  if(current==='game') {
    clearTimeout(botTimer);
    botThinking=false;
    pendingPromotion=null;
    document.getElementById('promotion').style.display='none';
  }

  renderScreen();
}

/* =====================================
   PROFILE IMAGE LOADING
===================================== */

function profileImage(name) {
  return 'Resources/bots/profiles/'+name.toLowerCase().replace(/\s+/g,'-');
}

function loadProfile(img,name,fallback) {

    'Resources/bots/profiles/'+name+'.png',
    'Resources/bots/profiles/'+name+'.jpg',
    'Resources/bots/profiles/'+name+'.webp'
  ];

  let index=0;

  img.onerror=()=>{
    index++;

    if(index<paths.length) {
      img.src=paths[index];
    } else {
      img.style.display='none';
      fallback.style.display='grid';
    }
  };

  img.src=paths[0];
}

/* =====================================
   HOME BOARD
===================================== */

function createPreviewBoard(container) {
  container.innerHTML='';

  const backrank=['r','n','b','q','k','b','n','r'];

  for(let i=0;i<64;i++) {
    const row=Math.floor(i/8);
    const col=i%8;

    const square=document.createElement('div');
    square.className='home-square '+((row+col)%2===0?'light':'dark');

    let piece=null;
    let side=null;

    if(row===0){piece=backrank[col];side='b'}
    if(row===1){piece='p';side='b'}
    if(row===6){piece='p';side='w'}
    if(row===7){piece=backrank[col];side='w'}

    if(piece) {
      const img=document.createElement('img');
      img.src=piecePaths[side]+side+piece+'.png';
      img.draggable=false;
      square.appendChild(img);
    }

    container.appendChild(square);
  }
}

function renderHomeBoard() {
  createPreviewBoard(document.getElementById('homeBoard'));
}

/* =====================================
   BOT SELECTION
===================================== */

function renderBots() {
  const grid=document.getElementById('botGrid');
  grid.innerHTML='';

  bots.forEach((bot,index)=>{
    const card=document.createElement('div');

    card.className='bot-card'+
      (selectedBot===index?' selected':'');

    const cover=document.createElement('div');
    cover.className='bot-cover';

    const img=document.createElement('img');
    const fallback=document.createElement('div');

    fallback.className='bot-cover-fallback';
    fallback.textContent=bot.avatar;
    fallback.style.display='none';

    loadProfile(img,bot.name,fallback);

    cover.append(img,fallback);

    const details=document.createElement('div');
    details.className='bot-details';

    const name=document.createElement('div');
    name.className='bot-name';
    name.textContent=bot.name;

    const elo=document.createElement('div');
    elo.className='bot-elo';
    elo.textContent=bot.elo.toLocaleString()+' Elo';

    const description=document.createElement('div');
    description.className='bot-description';
    description.textContent=bot.description;

    const quote=document.createElement('div');
    quote.className='bot-quote';
    quote.textContent='"'+bot.quote+'"';

    details.append(name,elo,description,quote);
    card.append(cover,details);

    card.onclick=()=>{
      selectedBot=index;
      renderBots();

      document.getElementById('startBot').disabled=false;
      document.getElementById('startBot').textContent='Play '+bot.name;
    };

    grid.appendChild(card);
  });
}

renderBots();

/* =====================================
   GAME START
===================================== */

function startBotGame() {
  if(selectedBot===null)return;

  mode='bot';

  const bot=bots[selectedBot];

  document.getElementById('blackName').textContent=bot.name;
  document.getElementById('blackElo').textContent=
    bot.elo.toLocaleString()+' Elo';

  const avatar=document.getElementById('blackAvatar');
  avatar.innerHTML='';

  const img=document.createElement('img');
  const fallback=document.createElement('span');
  fallback.textContent=bot.avatar;
  fallback.style.display='none';

  loadProfile(img,bot.name,fallback);
  avatar.append(img,fallback);

  startGame();
}

function startPractice() {
  mode='practice';

  document.getElementById('blackName').textContent='Black';
  document.getElementById('blackElo').textContent='';
  document.getElementById('blackAvatar').textContent='♟';

  startGame();
}

function startGame() {
  clearTimeout(botTimer);

  game=new Chess();
  flipped=false;
  selectedSquare=null;
  pendingPromotion=null;
  botThinking=false;
  messageLast='';

  if(mode==='bot') {
    const bot=bots[selectedBot];
    const messages=[
      'Lets play some chess!',
      'Ready for a game?',
      'Good luck! Youll need it.',
      'Ive been waiting for a match.',
      'Lets see who wins this one.',
      'Your move!',
      'Hope youre ready!'
    ];

    setMessage(bot.name+': '+
      messages[Math.floor(Math.random()*messages.length)]);
  } else {
    setMessage('Practice mode. Play both sides at your own pace.');
  }

  renderGame();
}

/* =====================================
   BOARD RENDERING
===================================== */

function squareName(row,col) {
  return 'abcdefgh'[col]+(8-row);
}

function renderGame() {
  const element=document.getElementById('board');
  element.innerHTML='';

  const board=game.board();
  const legal=selectedSquare?
    game.moves({square:selectedSquare,verbose:true}):[];

  const destinations=legal.map(m=>m.to);
  const history=game.history({verbose:true});
  const lastMove=history.length?history[history.length-1]:null;

  for(let display=0;display<64;display++) {
    const i=flipped?63-display:display;
    const row=Math.floor(i/8);
    const col=i%8;
    const name=squareName(row,col);

    const square=document.createElement('div');
    square.className='square '+((row+col)%2===0?'light':'dark');

    const piece=board[row][col];

    if(selectedSquare===name)square.classList.add('selected');

    if(lastMove&&(lastMove.from===name||lastMove.to===name)) {
      square.classList.add('last');
    }

    if(piece) {
      const img=document.createElement('img');
      img.src=piecePaths[piece.color]+
        piece.color+pieceLetters[piece.type]+'.png';
      img.alt=piece.color+piece.type;
      img.draggable=false;
      square.appendChild(img);
    }

    if(destinations.includes(name)) {
      const marker=document.createElement('div');
      marker.className=piece?'capture':'dot';
      square.appendChild(marker);
    }

    if(col===0) {
      const rank=document.createElement('span');
      rank.className='coordinates rank';
      rank.textContent=8-row;
      square.appendChild(rank);
    }

    if(row===7) {
      const file=document.createElement('span');
      file.className='coordinates file';
      file.textContent='abcdefgh'[col];
      square.appendChild(file);
    }

    square.addEventListener('click',()=>clickSquare(name));
    element.appendChild(square);
  }

  renderMoves();
  updateStatus();

  document.getElementById('undo').disabled=
    game.history().length===0;
}

function renderMoves() {
  const element=document.getElementById('moves');
  const history=game.history();

  element.innerHTML='';

  for(let i=0;i<history.length;i+=2) {
    const row=document.createElement('div');
    row.className='move-row';

    const number=document.createElement('span');
    number.className='move-number';
    number.textContent=(Math.floor(i/2)+1)+'.';

    const white=document.createElement('span');
    white.className='move';
    white.textContent=history[i]||'';

    const black=document.createElement('span');
    black.className='move';
    black.textContent=history[i+1]||'';

    row.append(number,white,black);
    element.appendChild(row);
  }

  element.scrollTop=element.scrollHeight;
}

function updateStatus() {
  const status=document.getElementById('status');

  if(game.in_checkmate()) {
    status.textContent='Checkmate! '+
      (game.turn()==='w'?'Black':'White')+' wins.';
  } else if(game.in_stalemate()) {
    status.textContent='Draw by stalemate.';
  } else if(game.in_draw()) {
    status.textContent='Game drawn.';
  } else if(game.in_check()) {
    status.textContent=
      (game.turn()==='w'?'White':'Black')+' to move · Check';
  } else {
    status.textContent=
      (game.turn()==='w'?'White':'Black')+' to move';
  }
}

/* =====================================
   PLAYER MOVES
===================================== */

function clickSquare(square) {
  if(game.game_over()||botThinking||pendingPromotion)return;

  if(mode==='bot'&&game.turn()==='b')return;

  const piece=game.get(square);

  if(!selectedSquare) {
    if(piece&&piece.color===game.turn()) {
      selectedSquare=square;
      renderGame();
    }
    return;
  }

  if(piece&&piece.color===game.turn()) {
    selectedSquare=square;
    renderGame();
    return;
  }

  const possible=game.moves({
    square:selectedSquare,
    verbose:true
  }).filter(m=>m.to===square);

  if(!possible.length) {
    selectedSquare=null;
    renderGame();
    return;
  }

  const move=possible[0];

  if(move.flags.includes('p')) {
    pendingPromotion={
      from:selectedSquare,
      to:square
    };

    selectedSquare=null;
    showPromotion();
    return;
  }

  makePlayerMove({
    from:selectedSquare,
    to:square
  });
}

function makePlayerMove(move) {
  try {
    game.move({...move,promotion:'q'});
  } catch(e) {
    return;
  }

  selectedSquare=null;
  renderGame();

  if(game.game_over()) {
    finishGame();
    return;
  }

  if(mode==='bot') {
    randomLine('thinking');
    scheduleBot();
  }
}

/* =====================================
   PROMOTION
===================================== */

function showPromotion() {
  const box=document.getElementById('promotion');
  const choices=document.getElementById('promotionChoices');

  choices.innerHTML='';

  for(const p of ['q','r','b','n']) {
    const btn=document.createElement('button');
    const img=document.createElement('img');
    const side=game.turn();

    img.src=piecePaths[side]+side+p+'.png';
    btn.appendChild(img);

    btn.onclick=()=>{
      box.style.display='none';

      const move=pendingPromotion;
      pendingPromotion=null;

      makePlayerMove({...move,promotion:p});
    };

    choices.appendChild(btn);
  }

  box.style.display='flex';
}

/* =====================================
   BOT DIALOGUE
===================================== */

function randomLine(category) {
  const lines=dialogue[category]||dialogue.thinking;

  let available=lines.filter(x=>x!==messageLast);
  if(!available.length)available=lines;

  const line=available[Math.floor(Math.random()*available.length)];
  setMessage(line);
}

function setMessage(text) {
  messageLast=text;
  document.getElementById('botMessage').textContent=text;
}

/* =====================================
   BOT BRAIN
===================================== */

const pieceValues={
  p:100,
  n:310,
  b:330,
  r:500,
  q:900,
  k:20000
};

function evaluateMove(move) {
  let score=0;

  const piece=game.get(move.from);
  const captured=game.get(move.to);

  if(captured) {
    score+=pieceValues[captured.type]*0.9;
  }

  if(move.flags.includes('p'))score+=850;

  if(move.san.includes('+'))score+=45;
  if(move.san.includes('#'))score+=50000;

  const col='abcdefgh'.indexOf(move.to[0]);
  const row=Number(move.to[1])-1;
  const centerDistance=Math.abs(3.5-col)+Math.abs(3.5-row);

  score+=(7-centerDistance)*3;

  if(piece.type==='n'||piece.type==='b') {
    const homeRank=game.turn()==='b'?8:1;
    if(Number(move.from[1])===homeRank)score+=10;
  }

  if(move.san==='O-O'||move.san==='O-O-O')score+=35;

  return score;
}

function botMistakeChance(bot) {
  if(bot.elo<=150)return .85;
  if(bot.elo<=250)return .78;
  if(bot.elo<=400)return .69;
  if(bot.elo<=700)return .56;
  if(bot.elo<=1000)return .43;
  if(bot.elo<=1300)return .32;
  if(bot.elo<=1500)return .25;
  if(bot.elo<=2000)return .17;
  return .09;
}

function chooseBotMove() {
  const moves=game.moves({verbose:true});

  if(!moves.length)return null;

  const bot=bots[selectedBot];
  const mistakeChance=botMistakeChance(bot);

  const evaluated=moves.map(move=>({
    move,
    score:evaluateMove(move)+Math.random()*15
  }));

  evaluated.sort((a,b)=>b.score-a.score);

  if(Math.random()<mistakeChance) {
    const lowerMoves=evaluated.slice(
      Math.max(0,Math.floor(evaluated.length*.3))
    );

    return lowerMoves[
      Math.floor(Math.random()*lowerMoves.length)
    ].move;
  }

  const count=bot.elo<=400?5:
    bot.elo<=700?4:
    bot.elo<=1300?3:
    bot.elo<=2000?2:2;

  const candidates=evaluated.slice(0,count);

  return candidates[
    Math.floor(Math.random()*candidates.length)
  ].move;
}

function scheduleBot() {
  if(game.game_over())return;

  botThinking=true;

  botTimer=setTimeout(()=>{
    if(game.game_over()) {
      botThinking=false;
      return;
    }

    const move=chooseBotMove();

    if(!move) {
      botThinking=false;
      return;
    }

    try {
      game.move({
        from:move.from,
        to:move.to,
        promotion:'q'
      });
    } catch(e) {
      botThinking=false;
      return;
    }

    botThinking=false;
    selectedSquare=null;
    renderGame();

    if(game.game_over()) {
      finishGame();
      return;
    }

    if(game.in_check()) {
      randomLine('check');
    } else if(Math.random()<.3) {
      randomLine(move.captured?'capture':'thinking');
    }

  },850+Math.random()*1100);
}

/* =====================================
   END GAME
===================================== */

function finishGame() {
  botThinking=false;
  clearTimeout(botTimer);
  renderGame();

  if(game.in_checkmate()) {
    if(game.turn()==='w') {
      randomLine('win');
    } else {
      randomLine('lose');
    }
  } else {
    setMessage('Draw! Good game.');
  }
}

/* =====================================
   GAME CONTROLS
===================================== */

document.getElementById('undo').onclick=()=>{
  if(!game||!game.history().length)return;

  game.undo();

  if(mode==='bot'&&game.turn()==='b'&&game.history().length) {
    game.undo();
  }

  selectedSquare=null;
  botThinking=false;
  clearTimeout(botTimer);
  renderGame();
};

document.getElementById('flip').onclick=()=>{
  flipped=!flipped;
  renderGame();
};

document.getElementById('restart').onclick=()=>{
  if(game)startGame();
};

/* =====================================
   ONLINE PLACEHOLDER
===================================== */

function onlineUnavailable() {
  const toast=document.getElementById('toast');

  toast.textContent=
    'Online is currently unavailable! Come back soon...';

  toast.classList.add('show');

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    toast.classList.remove('show');
  },3500);
}

/* =====================================
   INITIALIZE
===================================== */

renderHomeBoard();

</script>
